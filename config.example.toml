# makler-monitor configuration. Copy to config.toml and edit:
#   cp config.example.toml config.toml
# config.toml is gitignored because [monitor].telegram_bot_token is a secret.

[search]
# Category path on makler.md, the part after the language and region segments.
# Browse to a category and copy the path, e.g. for
#   https://makler.md/ru/transnistria/furniture-and-interior/furniture/wall-units
# use:
category = "furniture-and-interior/furniture/wall-units"

# Region — a URL segment. "transnistria" is Приднестровье / Prednistrovie (the default).
region = "transnistria"

# Site language for the URL: "ru" (default), "ro", or "en". Only the page chrome differs;
# the listings themselves are the same text whichever you pick.
language = "ru"

# Optional: restrict to specific cities (Russian names exactly as shown on listings).
# Run `list-cities` to discover what is available. Omit or leave empty for all cities.
cities = ["Тирасполь", "Бендеры"]

# Optional: only notify when the title or description contains one of these words.
keywords = ["шкаф", "купе"]

# Optional price range, in price_currency (one of: rub, usd, eur, lei). Listings in a
# different currency are converted via [search.price_rates] below (or skipped if no rate).
price_min = 0
price_max = 8000
price_currency = "rub"

# Optional dimension limits in centimetres, parsed from the free-text description (this is
# the whole point: makler.md cannot filter on size). Per axis set a min, a max, or both for
# a range; a listing passes an axis when its stated size is within them. By default an axis
# the seller did not state is allowed through; set unknown_dimension_ok = false to require
# every limited axis.
# min_width_cm = 90        # uncomment a min for a range, e.g. width 90-130 cm
max_width_cm = 130
# min_height_cm = 180
max_height_cm = 230
# min_depth_cm = 40
max_depth_cm = 50
unknown_dimension_ok = true

# Backlog pages swept per check; page 1 is always also scanned for new listings, and a
# saved cursor advances this many pages deeper each run, wrapping at the end of the category.
pages_per_batch = 2

# Optional cap on how deep the backlog sweep goes; omit to cover the whole category over
# time. On a very busy category, set it so the sweep wraps regularly and keeps pace with new
# postings (listings are tracked by ID, so nothing is ever double-processed).
# max_pages = 20

# Conversion rates so listings in OTHER currencies are range-checked too, given as
# "price_currency units per 1 unit of the listed currency" (here: PMR rubles per unit).
# Mid rates from Agroprombank — update occasionally. Omit a currency to skip those listings.
[search.price_rates]
usd = 16.3
eur = 19.16
lei = 0.96

[monitor]
# Each wait between checks is drawn at random from this window, so the polling
# cadence is not a fixed, fingerprintable interval (1200-2400s = 20-40 min).
check_interval_min_seconds = 1200
check_interval_max_seconds = 2400

# Where to remember which announcements have already been seen.
state_path = "seen.json"

# Random, human-like pause before every request, and request resilience.
min_delay_seconds = 3
max_delay_seconds = 8
request_timeout_seconds = 20
max_retries = 3

# Optional HTTP/HTTPS proxy, e.g. "http://user:pass@host:port". Leave blank for none.
proxy = ""

# "console" prints to the terminal; "telegram" pushes to your phone.
notifier = "console"

# For notifier = "telegram": get a token from @BotFather and your chat id from
# @userinfobot. Keep these secret (config.toml is gitignored).
telegram_bot_token = ""
telegram_chat_id = ""
